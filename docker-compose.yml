services:
  advisor:
    build: .
    image: advisor-mcp:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      ADVISOR_TRANSPORT: http
      ADVISOR_HTTP_HOST: 0.0.0.0
      ADVISOR_HTTP_PORT: 8787
      ADVISOR_HTTP_TOKEN: ${ADVISOR_HTTP_TOKEN:?set ADVISOR_HTTP_TOKEN}
      ADVISOR_PROVIDER: ${ADVISOR_PROVIDER:-openai-compatible}
      ADVISOR_MODEL: ${ADVISOR_MODEL:?set ADVISOR_MODEL}
      ADVISOR_API_KEY: ${ADVISOR_API_KEY:-}
      ADVISOR_BASE_URL: ${ADVISOR_BASE_URL:-https://api.openai.com/v1}
      ADVISOR_STORE: file
      ADVISOR_DATA_DIR: /data
      ADVISOR_HTTP_ALLOWED_ORIGINS: ${ADVISOR_HTTP_ALLOWED_ORIGINS:-}
      ADVISOR_HTTP_ALLOWED_HOSTS: ${ADVISOR_HTTP_ALLOWED_HOSTS:-}
      ADVISOR_HTTP_MAX_CONCURRENT_REQUESTS: ${ADVISOR_HTTP_MAX_CONCURRENT_REQUESTS:-8}
      ADVISOR_HTTP_REQUESTS_PER_MINUTE: ${ADVISOR_HTTP_REQUESTS_PER_MINUTE:-120}
      ADVISOR_HTTP_TRUST_PROXY: ${ADVISOR_HTTP_TRUST_PROXY:-false}
      ADVISOR_MAX_CALLS_PER_SESSION: ${ADVISOR_MAX_CALLS_PER_SESSION:-12}
      ADVISOR_MAX_CALLS_PER_MINUTE: ${ADVISOR_MAX_CALLS_PER_MINUTE:-30}
    volumes:
      - advisor-data:/data

volumes:
  advisor-data:
    driver: local
